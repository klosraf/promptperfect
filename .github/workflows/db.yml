name: Database

on:
  pull_request:
    branches: [main, feat/db-production-hardening]
    paths:
      - 'supabase/**'
      - '.github/workflows/db.yml'
  push:
    branches: [main, feat/db-production-hardening]
    paths:
      - 'supabase/**'
      - '.github/workflows/db.yml'
  workflow_dispatch:

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: promptperfect_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/promptperfect_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install pgcrypto + auth stub (ephemeral-only)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          psql "$DATABASE_URL" -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;"
          psql "$DATABASE_URL" -f supabase/tests/auth_stub.sql

      - name: Run migrations (idempotent runner)
        run: node supabase/migrate.js

      - name: Re-run migrations (idempotency gate)
        run: |
          node supabase/migrate.js --check
          echo "✅ No pending migrations after full run (idempotent)."

      - name: Seed fixtures
        run: psql "$DATABASE_URL" -f supabase/tests/seed.sql

      - name: Verify schema / constraints / RLS
        run: node supabase/tests/verify.js

      - name: Schema-diff guard (unrecorded DDL check)
        run: |
          # EGM E6 (F6-05): content-based guard — the old name-only check
          # only echoed a warning and could never fail. Now it exits 1 when
          # a PR changes real SQL in legacy setup scripts instead of adding
          # a migration (ADR-0004). Comment-only (-- ...) and blank-line
          # changes (e.g. a DEPRECATED header or a redaction note) pass.
          base="origin/${{ github.base_ref || 'main' }}"
          if ! raw_diff="$(git diff -U0 "$base" -- supabase/setup.sql supabase/run-all.sql supabase/SETUP_SHARE_FEATURE.sql supabase/fix_model_column.sql)"; then
            echo "❌ git diff against $base failed (base ref unavailable?) — failing closed instead of passing silently."
            exit 1
          fi
          changed="$(printf '%s\n' "$raw_diff" | grep -E '^[+-]' | grep -vE '^(\+\+\+|---)' | grep -vE '^[+-][[:space:]]*$' | grep -vE '^[+-][[:space:]]*--' || true)"
          if [ -n "$changed" ]; then
            echo "❌ Legacy setup scripts changed beyond comments/blank lines. New schema must go in supabase/migrations/ (see ADR-0004)."
            printf '%s\n' "$changed"
            exit 1
          fi
          echo "✅ Legacy setup scripts: no non-comment changes."
